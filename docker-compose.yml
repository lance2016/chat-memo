services:
  db:
    image: pgvector/pgvector:pg17
    container_name: chat-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: chat
      POSTGRES_PASSWORD: chat
      POSTGRES_DB: chat
    ports:
      # 暴露到宿主机，方便本地跑 psql / 不走容器直接跑后端
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chat -d chat"]
      interval: 5s
      timeout: 3s
      retries: 10

  phoenix:
    image: arizephoenix/phoenix:latest
    container_name: chat-phoenix
    restart: unless-stopped
    environment:
      # Phoenix stores complete prompts and responses; keep retention explicit.
      PHOENIX_DEFAULT_RETENTION_POLICY_DAYS: ${PHOENIX_RETENTION_DAYS:-14}
      PHOENIX_WORKING_DIR: /mnt/data
      # 本地只看自己的 trace，不需要 Phoenix 的遥测、外部字体或 MCP 能力。
      PHOENIX_TELEMETRY_ENABLED: "false"
      PHOENIX_ALLOW_EXTERNAL_RESOURCES: "false"
      PHOENIX_ENABLE_MCP_SERVER: "false"
      PHOENIX_ENABLE_MCP_CODE_MODE: "false"
      PHOENIX_ENABLE_PROMETHEUS: "false"
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      # Phoenix contains完整 prompt/response，只在本机开放；需要局域网访问时再显式改端口绑定。
      - "127.0.0.1:${PHOENIX_PORT:-16006}:6006"
    volumes:
      - phoenix_data:/mnt/data

  api:
    build:
      context: .
      args:
        # Docker 内直连 files.pythonhosted.org 经常 DNS 失败。只影响镜像构建，
        # 不改变宿主机 uv 配置；需要官方源时在 .env 覆盖。
        UV_DEFAULT_INDEX: ${UV_DEFAULT_INDEX:-https://mirrors.tuna.tsinghua.edu.cn/pypi/web/simple/}
    container_name: chat-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      phoenix:
        condition: service_started
    env_file: .env
    environment:
      # 覆盖 .env 里的宿主机地址 —— 容器内要走 compose 网络的服务名和内部端口。
      # 环境变量优先级高于 .env 文件，所以这行一定生效。
      DATABASE_URL: postgresql+asyncpg://chat:chat@db:5432/chat
      # 默认是「能跑任务」的那一档：不重启，ticker 正常工作。
      #
      # 改代码时用另一档：`RELOAD=1 JOBS_ENABLED=0 docker compose up -d api`。
      # 两个必须一起换 —— 热重载会把 lifespan 里的 ticker 反复掐掉重来，sleep 从头
      # 算起，600s 的整理 tick 基本永远等不到第一次触发，留着只是半死不活地空转。
      # 那一档下要测任务就手动触发：
      #   POST /api/jobs/consolidate?day=YYYY-MM-DD   POST /api/jobs/backup
      #   POST /api/notify/sweep                       （跑的是和 ticker 同一个 sweep）
      RELOAD: ${RELOAD:-0}
      JOBS_ENABLED: ${JOBS_ENABLED:-1}
      # TTS_BASE_URL 是宿主机直跑后端时使用的 127.0.0.1 地址，不能直接复用：
      # 容器里的 127.0.0.1 是容器自己。单独提供 Docker 覆盖项，避免 .env 中的
      # TTS_BASE_URL 把 host.docker.internal 默认值意外覆盖掉。
      TTS_BASE_URL: ${TTS_DOCKER_BASE_URL:-http://host.docker.internal:8001}
      # 设置页读取宿主机已下载的 Hugging Face 模型，不写缓存。
      TTS_MODEL_CACHE: /hf-cache
      # 容器默认 UTC，会让「今天」的判断和注入给模型的日期都差 8 小时，
      # 也会让 local_day_bounds 失效（每日整理按错误的窗口切天）。
      TZ: ${TZ:-Asia/Shanghai}
      # 浏览器默认经 frontend 的同源代理访问 API；仍保留 CORS，方便直接调试宿主机端口。
      CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost:${FRONTEND_PORT:-13000}"]}
      # Phoenix 随 compose 常起，不再是可选 profile。开关在设置页里（改完立刻生效），
      # 这里只给出容器网络里的上报地址。
      PHOENIX_COLLECTOR_ENDPOINT: ${PHOENIX_COLLECTOR_ENDPOINT:-http://phoenix:6006}
      OBS_PROJECT_NAME: ${OBS_PROJECT_NAME:-chat-memo}
      OBS_TRACE_HTTP_PATHS: ${OBS_TRACE_HTTP_PATHS:-/api/chat,/api/jobs/consolidate}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      # 宿主机设置了 VAULT_PATH 才启用知识库；:+ 表示「有值就替换成容器内挂载点」，
      # 否则为空串 —— 同时覆盖掉 env_file 里的宿主机路径，容器内那个路径不存在。
      VAULT_PATH: ${VAULT_PATH:+/vault}
    # Docker Desktop 自带这个域名，Linux 上要显式映射到网关才解析得了
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      # 8000 是容器内部端口；宿主机映射端口只用于调试和直连。
      - "${API_PORT:-18000}:8000"
    volumes:
      # 挂源码实现热重载。只挂需要的目录，不整个挂项目根：
      # 那样宿主机的 .venv（darwin/arm64）会盖掉容器里的依赖。
      - ./app:/app/app
      - ./alembic:/app/alembic
      - ./alembic.ini:/app/alembic.ini:ro
      - ./tests:/app/tests
      - ./pyproject.toml:/app/pyproject.toml:ro
      # 备份落到宿主机，容器重建也不会丢。
      # ⚠️ 默认的 ./backups 和数据在**同一块盘**，磁盘坏了两者一起走。
      # 在 .env 里设 BACKUP_HOST_DIR 指到 iCloud / 外置盘 / 网络盘，
      # 这是这套备份唯一还需要人做的决定。见 docs/backup.md。
      - ${BACKUP_HOST_DIR:-./backups}:/backups
      # 评测结果同理，而且**必须挂**：界面在容器里跑、命令行在宿主机跑，不挂的话
      # 两边各写各的 eval-runs，同一个功能长出两份互相看不见的历史 ——
      # baseline 对比会拿错参照，而且容器一重建，界面上跑出来的结果就全没了。
      - ./eval-runs:/app/eval-runs
      # 样本要能在宿主机用编辑器改（标注是手工活），容器里跑评测时读到的是同一份
      - ./evals:/app/evals
      # Obsidian vault 只读挂载（写保护做在挂载层，不依赖 prompt 约束）。
      # 未设置 VAULT_PATH 时挂个空占位目录，此时容器内 VAULT_PATH 为空、功能整体关闭。
      - ${VAULT_PATH:-./.vault-placeholder}:/vault:ro
      - ${HOME}/.cache/huggingface/hub:/hf-cache:ro
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=3).status==200 else 1)\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: development
    container_name: chat-frontend
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      # 浏览器请求同源 /backend；Next 容器再通过 Compose 服务名访问 API。
      # 这样前端不依赖宿主机 API_PORT，也没有跨域问题。
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-/backend}
      INTERNAL_API_BASE_URL: ${INTERNAL_API_BASE_URL:-http://api:8000}
      NEXT_PUBLIC_API_KEY: ${API_KEY:-}
      # Docker Desktop 的 bind mount 偶尔收不到文件事件，轮询可保证 HMR 稳定。
      WATCHPACK_POLLING: "true"
    ports:
      # 3000 是容器内部端口；浏览器访问的是左侧可配置的宿主机端口。
      - "${FRONTEND_PORT:-13000}:3000"
    volumes:
      # 依赖保留在镜像中，只挂需要热更新的源码和配置，避免宿主机
      # node_modules 覆盖容器里的 Linux 依赖。
      - ./frontend/app:/app/app
      - ./frontend/components:/app/components
      - ./frontend/lib:/app/lib
      - ./frontend/public:/app/public:ro
      - ./frontend/next.config.ts:/app/next.config.ts:ro
      - ./frontend/postcss.config.mjs:/app/postcss.config.mjs:ro
      - ./frontend/tsconfig.json:/app/tsconfig.json:ro
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  pgdata:
  phoenix_data:
