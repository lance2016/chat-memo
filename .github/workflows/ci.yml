# 最小 CI：挡住整类回归，不追求覆盖所有场景。
#
# 为什么是这四步：这个仓库上一次交接靠一条「前端构建当前是坏的」的手写注记，
# 在文档里躺了一天才在提交前被撞上。四步里 `next build` 最不能省 ——
# 类型检查和单测都发现不了共享组件里 `useSearchParams()` 缺 Suspense 边界
# 这类问题（见 docs/fixes.md 第一条），只有真构建一次会红。
#
# **不跑评测**：它要花模型 token、耗时以分钟计、结论要人读。见 docs/evaluation.md。
name: CI

on:
  # 所有分支的推送都跑。原来写的是 `branches: [main]` + `pull_request` ——
  # 那是「什么都往 main 提 PR」的团队惯例，而这里的实际用法是推特性分支、
  # 有时候才开 PR，结果就是推上去什么都不触发，CI 形同虚设。
  #
  # 不再单列 `pull_request`：单人仓库里 PR 的 head 就是这些分支之一，
  # 检查结果按 commit SHA 关联，PR 页面照样看得到，不必跑两遍。
  push:
    branches: ["**"]

concurrency:
  # 同一分支上新的推送直接取消旧的跑，不排队浪费额度
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --group dev --frozen
      # 后端测试跑在内存 SQLite 上，不需要数据库容器，也不需要任何密钥。
      # 这一点是有意维持的：一旦某个用例依赖 .env 里的真实 key，CI 就再也跑不起来。
      - run: uv run pytest -q
      - run: uv run ruff check app/

  # SQLite 单测保留快速反馈；这个独立任务只验证生产数据库最容易漂移的部分：
  # Alembic 全链、PostgreSQL 原生 JSONB、pg_trgm / pgvector 和搜索索引。
  postgres-smoke:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: chat
          POSTGRES_PASSWORD: chat
          POSTGRES_DB: chat
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U chat -d chat"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://chat:chat@localhost:5432/chat
      POSTGRES_SMOKE_DATABASE_URL: postgresql+asyncpg://chat:chat@localhost:5432/chat
      OBS_TRACING: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --group dev --frozen
      - run: uv run alembic upgrade head
      - run: uv run pytest tests/test_postgres_smoke.py -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      # 放最后：它最慢，而且前面三步能覆盖的问题不必等它
      - run: npm run build
