[project]
name = "chat"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.19.0",
    "anthropic>=0.116",
    "asyncpg>=0.31.0",
    "fastapi>=0.115",
    "httpx>=0.28.1",
    "openai>=2.53.0",
    "pydantic-settings>=2.14.2",
    "python-multipart>=0.0.31",
    "python-dotenv>=1.2.2",
    "socksio>=1.0.0",
    "sqlalchemy[asyncio]>=2.0",
    "uvicorn[standard]>=0.52.1",
    # 可观测性不再是可选项。48MB / 27 个包，对 476MB 的镜像来说不值得用一个构建
    # 参数去省 —— 而「可选」的实际结果是 Phoenix 容器一直在跑、依赖却没装，
    # 成本全付了、一条 trace 都没发。
    "arize-phoenix-otel>=0.16.0",
    "openinference-instrumentation-anthropic>=0.1.20",
    "openinference-instrumentation-openai>=0.1.30",
    "opentelemetry-exporter-otlp>=1.27.0",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
